version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: sentellent-postgres-pgvector
    environment:
      POSTGRES_DB: indian_stocks_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d indian_stocks_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sentellent-backend-agent
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/indian_stocks_db
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sentellent-frontend-web
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
